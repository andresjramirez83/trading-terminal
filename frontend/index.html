<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Terminal</title>
    <script>
      (() => {
        const browserCrypto = window.crypto;

        if (
          !browserCrypto ||
          typeof browserCrypto.randomUUID === "function" ||
          typeof browserCrypto.getRandomValues !== "function"
        ) {
          return;
        }

        const createRandomUUID = () => {
          const bytes = browserCrypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;

          const hex = Array.from(bytes, (byte) =>
            byte.toString(16).padStart(2, "0"),
          );

          return [
            hex.slice(0, 4).join(""),
            hex.slice(4, 6).join(""),
            hex.slice(6, 8).join(""),
            hex.slice(8, 10).join(""),
            hex.slice(10, 16).join(""),
          ].join("-");
        };

        Object.defineProperty(browserCrypto, "randomUUID", {
          configurable: true,
          value: createRandomUUID,
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
