# Trading Terminal Phase 6 nginx locations
# IMPORTANT: paste/include these directives INSIDE the existing server { ... } block
# that serves the Trading Terminal frontend.

# WebSockets must keep Upgrade/Connection headers. The trailing slash on
# proxy_pass intentionally strips the public /api/ws/ prefix and forwards
# /ws/... to FastAPI on localhost.
location ^~ /api/ws/ {
    proxy_pass http://127.0.0.1:8000/ws/;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# REST/API traffic stays on the same browser origin. Nginx reuses a local
# HTTP/1.1 upstream connection rather than exposing browser traffic to :8000.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    # Empty Connection header permits upstream keep-alive for ordinary HTTP.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Dynamic trading responses must never be cached by nginx.
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Compress JSON/JS/CSS over the browser-facing connection. This is especially
# useful for the Alpaca snapshot because the full order history remains intact
# while the wire payload is substantially smaller.
gzip on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_vary on;
gzip_types application/json application/javascript text/javascript text/css text/plain;
